<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Docs X - Workspace</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --text: #f8fafc;
        }
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        sidebar {
            width: 250px;
            background-color: var(--card-bg);
            padding: 20px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #334155;
        }
        h2 { margin-top: 0; color: #818cf8; }
        .nav-btn {
            background: none;
            border: none;
            color: #94a3b8;
            padding: 12px;
            text-align: left;
            font-size: 16px;
            cursor: pointer;
            border-radius: 8px;
            margin-bottom: 5px;
            transition: 0.2s;
        }
        .nav-btn:hover, .nav-btn.active {
            background-color: var(--accent);
            color: white;
        }
        main {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        .view { display: none; flex: 1; flex-direction: column; }
        .view.active { display: flex; }
        .stats-bar {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: var(--card-bg);
            padding: 15px 25px;
            border-radius: 10px;
            border: 1px solid #334155;
        }
        .stat-card span { font-weight: bold; color: #38bdf8; font-size: 18px; }
        .paint-container {
            display: flex;
            gap: 20px;
            flex: 1;
        }
        canvas {
            background: white;
            border-radius: 8px;
            cursor: crosshair;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
        }
