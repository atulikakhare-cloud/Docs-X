<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Docs X</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1e1e2e; color: #cdd6f4; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    header { background: #181825; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #313244; }
    .brand-container { display: flex; align-items: center; gap: 10px; }
    .brand-logo { width: 28px; height: 28px; background: #89b4fa; color: #11111b; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 16px; }
    h1 { font-size: 20px; color: #89b4fa; }
    .nav-tabs { display: flex; gap: 10px; background: #181825; padding: 8px 20px; border-bottom: 1px solid #313244; }
    .tab-btn { background: #313244; color: #cdd6f4; border: none; padding: 8px 16px; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.2s; }
    .tab-btn:hover { background: #45475a; }
    .toolbar { background: #313244; padding: 10px 20px; display: flex; gap: 10px; align-items: center; }
    button { background: #89b4fa; color: #11111b; border: none; padding: 8px 15px; border-radius: 5px; font-weight: bold; cursor: pointer; }
    button:hover { background: #b4befe; }
    .section { flex: 1; display: none; flex-direction: column; padding: 20px; overflow-y: auto; }
    textarea { width: 100%; height: 100%; background: #11111b; color: #cdd6f4; border: 1px solid #45475a; border-radius: 8px; padding: 20px; font-size: 16px; outline: none; resize: none; }
    .leaderboard-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 20px; }
    .lb-card { background: #181825; padding: 15px; border-radius: 8px; border: 1px solid #313244; text-align: center; }
    .lb-card h4 { color: #a6adc8; font-size: 12px; }
    .lb-card p { color: #89b4fa; font-size: 20px; font-weight: bold; margin-top: 5px; }
    .games-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
    footer { background: #181825; padding: 10px 20px; font-size: 12px; color: #a6adc8; display: flex; justify-content: space-between; border-top: 1px solid #313244; }
    
    #authOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #11111b; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 2000; }
    .auth-box { background: #1e1e2e; padding: 40px; border-radius: 12px; border: 1px solid #45475a; width: 360px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .auth-header { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 25px; }
    .auth-logo { width: 40px; height: 40px; background: #89b4fa; color: #11111b; border-radius: 8px; font-size: 24px; font-weight: bold; display: flex; align-items: center; justify-content: center; }
    .auth-title { font-size: 26px; color: #cdd6f4; font-weight: bold; }
    .auth-btn-group { display: flex; flex-direction: column; gap: 12px; margin-top: 10px; }
    .auth-btn { width: 100%; padding: 12px; border-radius: 6px; font-size: 15px; }
    .btn-secondary { background: #313244; color: #cdd6f4; }
    .btn-secondary:hover { background: #45475a; }
    .auth-form { display: none; flex-direction: column; gap: 12px; margin-top: 15px; text-align: left; }
    .auth-form input { width: 100%; padding: 10px; background: #11111b; border: 1px solid #45475a; border-radius: 6px; color: #cdd6f4; outline: none; }
    .auth-form label { font-size: 12px; color: #a6adc8; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://unpkg.com/docx@8.5.0/build/index.js"></script>
</head>
<body>

  <div id="authOverlay">
    <div class="auth-box">
      <div class="auth-header">
        <div class="auth-logo">DX</div>
        <div class="auth-title">Docs X</div>
      </div>
      
      <div id="authHome" class="auth-btn-group">
        <button class="auth-btn" onclick="showAuthForm('signup')">Sign Up</button>
        <button class="auth-btn btn-secondary" onclick="showAuthForm('login')">Log In</button>
      </div>

      <form id="signupForm" class="auth-form" onsubmit="handleAuthSubmit(event, 'signup')">
        <div>
          <label>Choose Username</label>
          <input type="text" id="su-user" required autocomplete="off">
        </div>
        <div>
          <label>Choose Password</label>
          <input type="password" id="su-pass" required>
        </div>
        <button type="submit" class="auth-btn" style="margin-top: 5px;">Create Account</button>
        <button type="button" class="auth-btn btn-secondary" onclick="resetAuthMenu()">Back</button>
      </form>

      <form id="loginForm" class="auth-form" onsubmit="handleAuthSubmit(event, 'login')">
        <div>
          <label>Username</label>
          <input type="text" id="li-user" required autocomplete="off">
        </div>
        <div>
          <label>Password</label>
          <input type="password" id="li-pass" required>
        </div>
        <button type="submit" class="auth-btn" style="margin-top: 5px;">Log In</button>
        <button type="button" class="auth-btn btn-secondary" onclick="resetAuthMenu()">Back</button>
      </form>

    </div>
  </div>

  <header>
    <div class="brand-container">
      <div class="brand-logo">DX</div>
      <h1>Docs X</h1>
    </div>
    <div style="display: flex; gap: 15px; align-items: center;">
      <span id="userBadge" style="color: #a6adc8; font-size: 14px;">User: Guest</span>
      <div id="status">Doccee 🪙: 0</div>
      <button onclick="logoutUser()" style="background: #f38ba8; font-size: 12px; padding: 4px 10px;">Logout</button>
    </div>
  </header>

  <div class="nav-tabs">
    <button id="tab-editor" class="tab-btn" style="background: #89b4fa; color: #11111b;" onclick="switchTab('editor')">📝 Document Editor</button>
    <button id="tab-media" class="tab-btn" onclick="switchTab('media')">🎨 Media Studio</button>
    <button id="tab-gaming" class="tab-btn" onclick="switchTab('gaming')">🎮 Gaming Hub</button>
  </div>

  <div id="editorSection" class="section" style="display: flex;">
    <div class="toolbar" style="margin-bottom: 15px; border-radius: 6px;">
      <button onclick="saveTXT()">Save as .TXT</button>
      <button onclick="savePDF()">Export as .PDF</button>
      <button onclick="saveDOCX()">Export as .DOCX</button>
    </div>
    <textarea id="editor" placeholder="Start typing your document here..."></textarea>
  </div>

  <div id="mediaSection" class="section">
    <h2>🎨 Media Studio</h2>
    <p style="margin-top: 10px; color: #a6adc8;">Media editing features are coming soon...</p>
  </div>

  <div id="gamingSection" class="section">
    <h2 style="margin-bottom: 15px;">🏆 4-Pillar Leaderboards</h2>
    <div class="leaderboard-grid">
      <div class="lb-card"><h4>TIME SPENT</h4><p id="lb-time">0 mins</p></div>
      <div class="lb-card"><h4>GAMES WON</h4><p id="lb-wins">0 wins</p></div>
      <div class="lb-card"><h4>DOCCEE BALANCE</h4><p id="lb-balance">0 🪙</p></div>
      <div class="lb-card"><h4>DOCCEE SPENT</h4><p id="lb-spent">0 🪙</p></div>
    </div>

    <h2 style="margin-bottom: 15px;">🎮 Mini-Games Hub</h2>
    <div id="gamesGrid" class="games-grid"></div>
  </div>

  <footer>
    <span id="charCount">0 characters</span>
    <span>Docs X v1.0</span>
  </footer>

  <script src="games.js"></script>
  <script src="games-ui.js"></script>
  <script src="editor.js"></script>
</body>
</html>
