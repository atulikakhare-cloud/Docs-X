<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <title>Docs X - Document Editor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1e1e2e; color: #cdd6f4; display: flex; flex-direction: column; height: 100vh; }
    header { background: #181825; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #313244; }
    h1 { font-size: 20px; color: #89b4fa; }
    .toolbar { background: #313244; padding: 10px 20px; display: flex; gap: 10px; align-items: center; }
    button { background: #89b4fa; color: #11111b; border: none; padding: 8px 15px; border-radius: 5px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:hover { background: #b4befe; }
    .editor-container { flex: 1; padding: 20px; display: flex; justify-content: center; }
    textarea { width: 100%; max-width: 900px; height: 100%; background: #11111b; color: #cdd6f4; border: 1px solid #45475a; border-radius: 8px; padding: 20px; font-size: 16px; line-height: 1.6; resize: none; outline: none; }
    footer { background: #181825; padding: 10px 20px; font-size: 12px; color: #a6adc8; display: flex; justify-content: space-between; border-top: 1px solid #313244; }
  </style>

  <!-- External Libraries for PDF and DOCX export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://unpkg.com/docx@8.5.0/build/index.js"></script>
</head>
<body>

  <header>
    <h1>Docs X - Document Editor</h1>
    <div id="status">Doccee 🪙: 0</div>
  </header>

  <div class="toolbar">
    <button onclick="saveTXT()">Save as .TXT</button>
    <button onclick="savePDF()">Export as .PDF</button>
    <button onclick="saveDOCX()">Export as .DOCX</button>
  </div>

  <div class="editor-container">
    <textarea id="editor" placeholder="यहाँ अपना डॉक्यूमेंट टाइप करना शुरू करें..."></textarea>
  </div>

  <footer>
    <span id="charCount">0 characters</span>
    <span>Docs X v1.0</span>
  </footer>

  <script>
    const { ipcRenderer } = require('electron');
    const editor = document.getElementById('editor');
    const charCount = document.getElementById('charCount');

    editor.addEventListener('input', () => {
      charCount.innerText = `${editor.value.length} characters`;
    });

    // Save as .TXT
    async function saveTXT() {
      const text = editor.value;
      if (!text.trim()) return alert('कृपया पहले कुछ लिखें!');
      
      const res = await ipcRenderer.invoke('save-file', {
        content: text,
        defaultName: 'document.txt',
        filters: [{ name: 'Text File', extensions: ['txt'] }]
      });

      if (res.success) alert('फाइल .txt में सफलतापूर्वक सेव हो गई!');
    }

    // Export as .PDF
    async function savePDF() {
      const text = editor.value;
      if (!text.trim()) return alert('कृपया पहले कुछ लिखें!');

      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      
      const splitText = doc.splitTextToSize(text, 180);
      doc.text(splitText, 10, 10);

      const pdfData = doc.output('arraybuffer');
      const buffer = Buffer.from(pdfData);

      const res = await ipcRenderer.invoke('save-file', {
        content: buffer,
        defaultName: 'document.pdf',
        filters: [{ name: 'PDF Document', extensions: ['pdf'] }]
      });

      if (res.success) alert('फाइल .pdf में सफलतापूर्वक एक्सपोर्ट हो गई!');
    }

    // Export as .DOCX
    async function saveDOCX() {
      const text = editor.value;
      if (!text.trim()) return alert('कृपया पहले कुछ लिखें!');

      const docxLib = window.docx;
      const doc = new docxLib.Document({
        sections: [{
          children: text.split('\n').map(line => new docxLib.Paragraph({
            children: [new docxLib.TextRun(line)]
          }))
        }]
      });

      const blob = await docxLib.Packer.toBuffer(doc);

      const res = await ipcRenderer.invoke('save-file', {
        content: blob,
        defaultName: 'document.docx',
        filters: [{ name: 'Word Document', extensions: ['docx'] }]
      });

      if (res.success) alert('फाइल .docx में सफलतापूर्वक एक्सपोर्ट हो गई!');
    }
  </script>
</body>
</html>
